services:
  api:
    build:
      context: .
      dockerfile: Notion.Sync.Api/Dockerfile
    ports:
      - "127.0.0.1:5021:7031"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:7031"
      Revalidation__Url: "http://host.docker.internal:3000/api/revalidate"
    volumes:
      - "${APPDATA}/Microsoft/UserSecrets/af598fa0-4a2d-4362-8530-a0c49add5792:/home/app/.microsoft/usersecrets/af598fa0-4a2d-4362-8530-a0c49add5792:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
